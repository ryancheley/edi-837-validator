{% extends "base.html" %}
{% block content %}
<h1 class="text-2xl font-semibold mb-6">Log in</h1>
<form method="post" class="bg-white rounded-lg border border-slate-200 p-6 space-y-4 max-w-sm">
  {% csrf_token %}
  {% if form.errors %}<div class="rounded bg-red-100 text-red-800 px-4 py-2 text-sm">Invalid username or password.</div>{% endif %}
  <div>
    <label class="block text-sm font-medium mb-1">Username</label>
    <input type="text" name="username" autofocus required class="w-full rounded border border-slate-300 px-3 py-2">
  </div>
  <div>
    <label class="block text-sm font-medium mb-1">Password</label>
    <input type="password" name="password" required class="w-full rounded border border-slate-300 px-3 py-2">
  </div>
  <button class="rounded bg-sky-600 px-4 py-2 text-white hover:bg-sky-700 w-full">Log in</button>
</form>
{% endblock %}
