{% extends "base.html" %}
{% block content %}
<div class="flex items-center justify-between mb-6">
  <h1 class="text-2xl font-semibold">Plans</h1>
  <a href="{% url 'plan_create' %}" class="rounded bg-sky-600 px-4 py-2 text-white hover:bg-sky-700">New plan</a>
</div>

{% if plans %}
<div class="bg-white rounded-lg border border-slate-200 divide-y divide-slate-100">
  {% for p in plans %}
    <a href="{% url 'plan_detail' p.pk %}" class="flex items-center justify-between px-4 py-3 hover:bg-slate-50">
      <span class="font-medium">{{ p.name }}</span>
      <span class="text-sm text-slate-500">
        {{ p.payer_id }}
        {% if p.active_ruleset %}<span class="ml-2 rounded-full bg-green-100 text-green-800 px-2 py-0.5 text-xs">active ruleset</span>{% endif %}
      </span>
    </a>
  {% endfor %}
</div>
{% else %}
  <p class="text-slate-500">No plans yet. Create one to upload a companion guide.</p>
{% endif %}
{% endblock %}
