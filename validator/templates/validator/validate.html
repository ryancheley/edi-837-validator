{% extends "base.html" %}
{% block content %}
<h1 class="text-2xl font-semibold mb-6">Validate an 837 claim file</h1>

{% if error %}<div class="mb-4 rounded bg-red-100 text-red-800 px-4 py-2">{{ error }}</div>{% endif %}

<form method="post" enctype="multipart/form-data"
      hx-post="{% url 'validate' %}" hx-target="#results" hx-encoding="multipart/form-data"
      hx-indicator="#spin" class="bg-white rounded-lg border border-slate-200 p-6 space-y-4">
  {% csrf_token %}
  <div>
    <label class="block text-sm font-medium mb-1">837I / 837P file</label>
    <input type="file" name="edi_file" required accept=".edi,.txt,.x12,.837"
           class="w-full rounded border border-slate-300 px-3 py-2">
  </div>
  <div>
    <label class="block text-sm font-medium mb-1">Validate against plan (optional)</label>
    <select name="plan" class="w-full rounded border border-slate-300 px-3 py-2">
      <option value="">— Base TR3 only —</option>
      {% for p in plans %}<option value="{{ p.pk }}">{{ p.name }}</option>{% endfor %}
    </select>
  </div>
  <button class="rounded bg-sky-600 px-4 py-2 text-white hover:bg-sky-700">Validate</button>
  <span id="spin" class="htmx-indicator text-slate-500">Validating…</span>
</form>

<div id="results" class="mt-8">
  {% if result %}{% include "validator/_results.html" %}{% endif %}
</div>
{% endblock %}
