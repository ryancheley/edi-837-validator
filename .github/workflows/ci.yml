name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  # Each check is its own job so a failure in one (e.g. Ruff) doesn't skip the
  # others (e.g. the test suite). fail-fast: false keeps all legs running.
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lint
            run: uv run ruff check .
          - name: types
            run: uv run ty check
          - name: test
            run: uv run pytest -q
          - name: workflow-audit
            run: uv run zizmor .github/workflows/
          # Fails when actions.lock is out of sync with the workflows or a
          # locked pin no longer verifies upstream.
          - name: actions-lockfile
            run: gh extension install github/gh-actions-lock --pin v0.4.1 && gh actions-lock --verify
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}
        env:
          GH_TOKEN: ${{ github.token }}
