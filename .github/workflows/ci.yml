name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Each check is its own job so a failure in one (e.g. Ruff) doesn't skip the
  # others (e.g. the test suite). fail-fast: false keeps all legs running.
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lint
            run: uv run ruff check .
          - name: types
            run: uv run ty check
          - name: test
            run: uv run pytest -q
          - name: workflow-audit
            run: uv run zizmor .github/workflows/
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}
        env:
          GH_TOKEN: ${{ github.token }}
