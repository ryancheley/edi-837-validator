version: 2
updates:
  # Keep the locked actions current (Dependabot updates the tag in ci.yml and
  # the SHA in .github/workflows/actions.lock together).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # Python dependencies (pyproject.toml + uv.lock). Group minor/patch to cut
  # PR noise; majors come as their own PRs since they may break.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
